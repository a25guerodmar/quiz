<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Joc de preguntes</title>
    <link rel="stylesheet" href="style.css">

    <!-- Link para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Link para el estilo de fuente -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

<body>
    <!-- Contenedor del usuario -->
    <div class="contenedor-flex">
        <div id="usuario">

        </div>
        <!-- Temporizador -->
        <div id="temporizador">
            <img src="img/cronometro.png">
            <span>Temps: <br> <span id="tiempo">0</span> segons</span>
        </div>
        <div id="marcador">
            
        </div>
     </div>
    <!-- Contenedor del juego -->
    <div id="partida">
        <i class="fa fa-arrow-left" id="btn-anterior"></i>
        <div id="ficha">

        </div>
        <i class="fa fa-arrow-right" id="btn-siguiente"></i>
        <button id="btn_enviar" class="hidden">Enviar Resultats</button>
    </div>

    <script src="funcions.js"></script>
