<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel de administración</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                Panel de administración
            </span>

            <a href="/" class="btn btn-outline-light btn-sm">
                Volver al juego
            </a>
        </div>
    </nav>


    <!-- CONTENIDO -->
    <main class="container py-4">

        <!-- CABECERA -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h1 class="h3 mb-1">Preguntas</h1>
                <p class="text-muted mb-0">
                    Gestiona las preguntas del juego.
                </p>
            </div>

            <button
                type="button"
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#modalPregunta"
                onclick="nuevaPregunta()"
            >
                + Nueva pregunta
            </button>

        </div>


        <!-- TABLA -->
        <div class="card shadow-sm">

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Pregunta</th>
                                <th>Respuesta 1</th>
                                <th>Respuesta 2</th>
                                <th>Respuesta 3</th>
                                <th>Respuesta 4</th>
                                <th>Correcta</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="tablaPreguntas">

                            <!--
                                Las preguntas se cargarán
                                posteriormente mediante JavaScript.
                            -->

                            <tr>
                                <td colspan="8" class="text-center text-muted py-4">
                                    Cargando preguntas...
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>


    <!-- MODAL CREAR / EDITAR -->
    <div
        class="modal fade"
        id="modalPregunta"
        tabindex="-1"
        aria-labelledby="modalPreguntaLabel"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <!-- HEADER -->
                <div class="modal-header">

                    <h5 class="modal-title" id="modalPreguntaLabel">
                        Nueva pregunta
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar"
                    ></button>

                </div>


                <!-- FORMULARIO -->
                <form id="formPregunta">

                    <div class="modal-body">
                        <!-- PREGUNTA -->
                        <div class="mb-3">

                            <label for="pregunta" class="form-label">
                                Pregunta
                            </label>

                            <textarea
                                class="form-control"
                                id="pregunta"
                                rows="2"
                                required
                            ></textarea>

                        </div>


                        <!-- RESPUESTAS -->
                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label for="resposta1" class="form-label">
                                    Respuesta 1
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="resposta1"
                                    required
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label for="resposta2" class="form-label">
                                    Respuesta 2
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="resposta2"
                                    required
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label for="resposta3" class="form-label">
                                    Respuesta 3
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="resposta3"
                                    required
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label for="resposta4" class="form-label">
                                    Respuesta 4
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="resposta4"
                                    required
                                >

                            </div>

                        </div>


                        <!-- RESPUESTA CORRECTA -->
                        <div class="mb-3">

                            <label for="resposta_correcta" class="form-label">
                                Respuesta correcta
                            </label>

                            <select
                                class="form-select"
                                id="resposta_correcta"
                                required
                            >

                                <option value="">
                                    Selecciona una respuesta
                                </option>

                                <option value="1">
                                    Respuesta 1
                                </option>

                                <option value="2">
                                    Respuesta 2
                                </option>

                                <option value="3">
                                    Respuesta 3
                                </option>

                                <option value="4">
                                    Respuesta 4
                                </option>

                            </select>

                        </div>


                        <!-- IMAGEN -->
                        <div class="mb-3">

                            <label for="imatge" class="form-label">
                                Imagen
                            </label>

                            <input
                                type="file"
                                class="form-control"
                                id="imatge"
                                accept="image/*"
                            >

                            <div class="form-text">
                                Selecciona una imagen para la pregunta.
                            </div>

                        </div>


                    <!-- FOOTER -->
                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                        >
                            Cancelar
                        </button>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Guardar
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <!-- BOOTSTRAP JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- JS DEL PANEL -->
    <script src="script.js"></script>

</body>

</html>
